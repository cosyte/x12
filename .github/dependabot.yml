# The "Dependabot Updates" run in this repository's Actions tab is GitHub's own
# hosted, dynamic workflow. It is driven by THIS file, and no file under
# .github/workflows/ defines it, so looking for it there is a dead end.
#
# When "Dependabot Updates" fails, diagnose it from this file and from that run's
# own logs, never from a workflow file. Its cause can also lie entirely outside
# this repository (org-level Dependabot settings, registry credentials, or the
# hosted updater itself), in which case there is nothing here to change.
#
# GitHub also starts one "Dependabot Updates" run per update job, so one push
# produces several. A security-alert job can fail (for example when no
# non-vulnerable version of a transitive dependency is resolvable) while the
# scheduled jobs configured below succeed, so read the individual run before
# concluding that anything below is wrong.
version: 2
updates:
  # npm dev-dependencies (the parsers ship zero runtime deps)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # Wait a day after a release before proposing it, the same 24 hours pnpm-workspace.yaml's
    # minimumReleaseAge holds every install to. Security updates are not delayed.
    cooldown:
      default-days: 1
    # The commit message, and so the pull request title, is `chore(deps): bump ...` or
    # `chore(deps-dev): bump ...`: Conventional Commits, which pr-title.yml checks on every pull
    # request. Without a prefix Dependabot guesses one from the history.
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node describes the oldest Node.js this package runs on (engines: >=22), so it stays
      # on the 22 line. A newer major type-checks calls that Node 22 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @cosyte/process owns the vitest and typescript versions; this repository declares them
      # directly only because test files import vitest and the compiler API, pinned to exactly the
      # versions process runs. They move when process does, never on their own.
      - dependency-name: "vitest"
      - dependency-name: "typescript"
  # keep GitHub Actions references current
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # From v1.75.0 this action installs actionlint by piping a script from a fork to bash. The
      # shared CI runs the official rhysd/actionlint release, checked by its SHA-256, instead, and
      # no workflow here uses the action; this keeps an update from proposing it again.
      - dependency-name: "reviewdog/action-actionlint"
      # The cosyte/.github reusable workflows are pinned to the commit of a published `workflows-*`
      # reference and move by hand, with every caller here, together (ST37). Left to Dependabot, a
      # commit pin with no version tag is offered the newest commit on cosyte/.github's main, which is
      # not a published reference.
      - dependency-name: "cosyte/.github*"

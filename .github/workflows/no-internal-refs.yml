name: Public-surface gate

# No internal project bookkeeping on a surface a consumer reads: item identifiers, phase and wave
# language, ADR numbers, internal repository paths and traceability markers belong in the
# changeset, the commit, the pull request and the umbrella's plans, never in README.md,
# TRADEMARKS.md, LICENSE, KNOWN-LIMITATIONS.md, docs-content/, the npm description and keywords, or
# the `src/` doc comments that compile into `dist/*.d.ts` and the `src/` string literals a consumer
# reads as warning, error and code-list text. The gate is the shared implementation in
# @cosyte/script-utils (ST34), and this repository keeps only its axes, in
# scripts/internal-refs.json, with one rule of its own: a bare umbrella work-item id (`S` and four
# digits, then a hyphen). X12 is both the standard and our own item prefix, so it is a project
# prefix there and no X12 designation is excluded: the sibling repos' exclusion matched 141 of our
# identifiers (#120).
#
# THE JOB ID IS LOAD-BEARING: it publishes `no-internal-refs / public-surface`, which a ruleset may
# require. There is no `edited` trigger, because nothing here reads pull request text, which is
# where an identifier belongs. The workflow installs from the lockfile first, because the gate
# lives in node_modules.
#
# Run it locally with `pnpm check:no-internal-refs` after `git add`: the gate reads `git ls-files`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-internal-refs:
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs-install.yml@498c7c13c8869bf11b67fa8324684ec2dc691ec6 # workflows-2026-11-07-498c7c13c886
    permissions:
      contents: read

name: Public-surface gate

# Founder directive 2026-07-27: no internal project bookkeeping on any surface a consumer
# reads. Item identifiers, phase and wave language, ADR numbers, meta-repo paths and
# process commentary belong in the changeset, CHANGELOG.md, the commit, the PR and the
# roadmap, never in README.md, KNOWN-LIMITATIONS.md, docs-content/, the npm description, or
# the JSDoc that compiles into `dist/`. The rule is written out in the meta-repo's
# `documentation/conventions.md`; `scripts/check-no-internal-refs.sh` is what enforces it.
#
# WHY A GATE AND NOT A NOTE. The founder, on the sweep that removed these across the
# ecosystem: "it needs to not just be a memory note, but something that is addressed in the
# workflow accordingly. This needs to not happen again." A sweep regresses the first time
# someone writes an item identifier into a README; a job that reds does not. In this repo
# that argument is not abstract: every accuracy finding in this package's recent review
# history has been a claim defect in a prose carrier, and until this landed no test in the
# suite could fail on one.
#
# WHAT ACTUALLY SCANS, AND WHERE THE RULE LIVES. `pnpm check:no-internal-refs`, which is
# this repository's own `scripts/check-no-internal-refs.sh`. The job below delegates the
# plumbing (checkout, pnpm, Node) to the shared gate workflow, which carries no pattern, no
# allow-list and no file selection of its own: it prepares the tree, runs the command, and
# lets the command's exit status decide the job. The rule set stays here, which matters in
# this repository more than most: `X12` is both a standards designator and our own item
# prefix, and only a per-repo rule set can tell the two apart.
#
# THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-internal-refs` below publishes
# `no-internal-refs / public-surface`. A branch ruleset binds to that exact string, and
# renaming the job detaches the requirement with no error anywhere.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. Same reasoning as the em-dash gate next
# door, and the first half is the deciding one:
#
#   The shared ci pipeline is not an option. x12's `ci` job calls
#   cosyte/.github/.github/workflows/ci.yml, which runs a fixed ladder and no arbitrary
#   repo script, so there is nowhere in it to hang this. Adding a step there would land the
#   gate on every caller at once, and remediating each is its own deliberate piece of work.
#   A shared pipeline is the wrong place to land a rule most of its callers cannot yet
#   satisfy.
#
#   Within x12, keeping it out of ci.yml also keeps it cheap: this job is a checkout and a
#   handful of greps over 14 public-surface files and 108 source files, while ci.yml drives
#   the full Node 22 + 24 matrix plus the release dry run.
#
# WHAT THIS DOES NOT CHECK, deliberately: the PR title, the PR body, and commit messages.
# The em-dash gate scans all three because the brand rule names commit messages explicitly.
# THIS rule says the opposite: identifiers BELONG in the commit, the PR and the changeset,
# so a PR-text half here would red on correct work. That is also why there is no `edited`
# trigger: nothing here reads PR text, so retitling a PR cannot change the result.
#
# WHAT THIS GATE CANNOT DO, stated so a green run is not over-read. It reads `src/` doc
# comments, which are the SOURCE of the published declarations, not `dist/` itself: `dist/`
# is untracked build output and this script does not build. The proxy holds only because
# the dts build copies doc text verbatim.
#
# NOT A REQUIRED CHECK YET. The org ruleset pins the required contexts for this repo and
# `Public-surface gate / no-internal-refs` is not among them, so a PR carrying an internal
# reference reds this check VISIBLY but is still mergeable. Making it required is an
# org-level ruleset change, outside this repo. Until then the gate informs a human; it does
# not stop one. Re-derive that rather than trusting this line.
#
# Run it locally with `pnpm check:no-internal-refs`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-internal-refs:
    # Pinned to the 40 character commit, not to the tag beside it: a tag can be moved
    # or deleted by anyone who gains write access to the workflow's repository, so a
    # tag is not an immutable reference and is not a pin. The trailing comment is the
    # published reference that commit was released as, so the release note stays
    # findable from here.
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs.yml@84ecccd771cbc9c1ece003a3f8ff61415360395b # workflows-2026-09-18-84ecccd771cb
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read

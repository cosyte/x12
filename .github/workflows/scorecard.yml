name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "27 3 * * 2"

permissions:
  contents: read

jobs:
  scorecard:
    permissions:
      contents: read # required to resolve the reusable workflow (else contents:none → startup failure)
      security-events: write # upload the SARIF to the Security tab
      id-token: write # publish results to the OpenSSF API (for the badge)
    uses: cosyte/.github/.github/workflows/scorecard.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927

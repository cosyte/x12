name: Em-dash gate

# The em and en dash gate (ST8, ST34): the shared implementation in @cosyte/script-utils, run by
# the shared workflow over every tracked file and over the pull request title, body and commit
# messages, since the brand rule names commit messages explicitly. What this repository leaves out,
# if anything, goes in scripts/check-no-emdash.exclude, which the gate reads for itself. The
# workflow installs from the lockfile first, because the gate lives in node_modules.
#
# TWO CONTEXTS, AND THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-emdash` publishes
# `no-emdash / tracked-files` and `no-emdash / messages`. The ruleset `emdash-required-check`
# requires `no-emdash / tracked-files`, and renaming the job detaches that requirement with no error
# anywhere. `no-emdash / messages` is deliberately not required: Dependabot composes a pull request
# body out of upstream release notes, and a gate that fails on someone else's clock is a tax.
#
# `edited` is among the pull_request types because this repository squash-merges: the title and
# body are the commit message that lands, so a retitled pull request is checked again.
#
# Run it locally with `pnpm check:no-emdash` after `git add`: the gate reads `git ls-files`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

# No concurrency group. A push and a title or body edit can arrive together (Dependabot does both),
# and a run a group cancels, even a queued one under `cancel-in-progress: false`, can count as a
# failed required check and block the merge until someone re-runs it. Each run takes seconds, so
# every one finishes and the newest result stands.

permissions:
  contents: read

jobs:
  no-emdash:
    uses: cosyte/.github/.github/workflows/gate-no-emdash-install.yml@498c7c13c8869bf11b67fa8324684ec2dc691ec6 # workflows-2026-11-07-498c7c13c886
    permissions:
      contents: read

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run on main, 05:25 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "25 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on Node 22, 24 and 26, on Linux, Windows and macOS. x12 ships a
  # PHI scanner, so the shared pipeline's optional PHI-scan step is switched on.
  #
  # The shared pipeline is named at an immutable published reference, never at the callee's default
  # branch: a floating reference delivers every later change made there on that repository's clock
  # rather than this one's, reviewed by nobody here, so x12's CI conclusion could move with no x12
  # commit. Every workflow here that calls cosyte/.github names a reference pinned by its commit,
  # with the reference in the comment. This caller, nightly-properties.yml and weekly-mutation.yml
  # name the newest release, whose weekly run is sharded; the other callers move to it with the next
  # change to them. A newer release is listed at https://github.com/cosyte/.github/releases.
  #
  # The testing standard's jobs run beside `verify`, never after it, so a pull request waits for the
  # slowest job rather than their sum:
  # - `bun` and `deno`: the whole suite again under Bun and under Deno, each in its own job on
  #   Linux. A test that cannot run there is skipped by name with its reason.
  # - `coverage-ratchet`: coverage held to quality-floor.json, and on a pull request every changed
  #   line that coverage counts must have run and no floor may be lowered or removed.
  # - `mutation` (pull requests only): the changed source files mutated with stryker.config.mjs, on
  #   the suite of vitest.mutation.config.ts, and every mutant in the changed lines killed. That
  #   suite leaves out test/perf/, so this job never repeats the scaling gate's work. The full run
  #   is weekly-mutation.yml's.
  #
  # The performance standard's two jobs run beside `verify` too:
  # - `scaling-gate`: `pnpm test:perf`, the scaling gate on `parseX12` and on the typed reader and
  #   builder of the 835, 837P, 837I, 270, 271, 999, 997 and 275 shapes the bench measures, and its
  #   self-check, never under coverage. The other shapes are `scaling-gate-sets` below.
  # - `bench-compare` (pull requests only): bench/x12.bench.mjs timed on the base build and the head
  #   build, interleaved on one runner, at the sizes that run in milliseconds. Advisory: it never
  #   fails, so never require it. The large sizes are measured by bench.yml's reading instead.
  #
  # A skipped job satisfies a required check, so require `bun`, `deno`, `coverage-ratchet`,
  # `mutation` or `scaling-gate` only while its input below stays on.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@398cd4ded647dddd9f2e220ceb042840f59e1426 # the release of 398cd4ded647
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      run-phi-scan: true
      run-bun: true
      run-deno: true
      run-coverage-ratchet: true
      run-mutation: true
      run-scaling-gate: true
      run-bench-compare: true
      bench-suites: bench/x12.bench.mjs

  # The second half of the scaling gate: `pnpm test:perf:sets`, the gate and its self-check on the
  # typed reader and builder of the 276, 277, 277CA, 277 request for additional information, 278,
  # 820, 834, 837D and TA1 shapes the bench measures. The shared `scaling-gate` job above runs
  # `pnpm test:perf`, the 835, 837, 270, 271, 999, 997 and 275 half, in about nine minutes; both
  # halves in one job would pass its 15 minute bound, so this half runs here, beside it, on the
  # same runner class and Node line, and never under coverage.
  scaling-gate-sets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:perf:sets

  # Prove the publish pipeline on every push/PR WITHOUT burning a version or needing registry auth
  # (X12-10, mirroring config's REL-PIPE). Two auth-free proofs:
  #   1. `pnpm publish --dry-run` exercises the real publish command path (manifest, `files` set,
  #      access, tag), the release itself publishes via `changeset publish`, so this is a faithful
  #      proxy. It runs `--ignore-scripts` because the `prepublishOnly` gates (typecheck/lint/test/
  #      build/attw) already run in the `ci` job above on this same commit, re-running them here is
  #      redundant, and `attw --pack .` inside `prepublishOnly` breaks under `pnpm publish` (it can't
  #      find its own packed tarball). We build explicitly first so a real `dist/` is present.
  #   2. `npm pack --dry-run` asserts the publishable tarball actually assembles with the right file
  #      set + built `dist/`, independent of what's already on npm (`publish --dry-run` skips an
  #      already-published version; `pack` never does). A red in either step means a real release
  #      would fail. The real publish runs in release.yml, through npm trusted publishing.
  release-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Exercise the publish command path (auth-free dry run; never uploads).
      - name: Publish dry-run
        run: pnpm publish --dry-run --no-git-checks --ignore-scripts
      # Assert the publishable tarball assembles (catches missing files/dist/exports) even when the
      # current version is already on npm, which `publish --dry-run` skips.
      - name: Pack integrity
        run: npm pack --dry-run --ignore-scripts

  # Re-run the differential comparison against both external oracles on every push and PR.
  #
  # The committed `test/differential/report.json` is the record of one run, and `pnpm test` only
  # gates it against `X12_TR3_CONFORMANCE` going stale. Neither notices a parse change that moves a
  # decoded value away from what another reader returns, so a harness that ran once at landing would
  # go on recording agreement that was true once. This job is what keeps it true: both oracles are
  # obtained for real and the comparison is run for real.
  #
  # WHAT THIS JOB GATES ON IS REPRODUCTION, NOT THE COMPARISON'S EXIT STATUS, and that is deliberate.
  # The corpus holds a document this library and pyx12 genuinely disagree about, so
  # `pnpm run differential` exits non-zero by design for as long as that disagreement stands: a
  # divergence is reported and left standing rather than fixed or suppressed. Gating on that status
  # would leave exactly two ways to a green check, fixing the parser or dropping the document from
  # the corpus, and the second is the cheap one. So the job runs `pnpm run differential:check`, the
  # same one command a developer or a reviewer runs, which runs the comparison for real and exits 0
  # only when the live report reproduces the committed one, divergences included. A parse change
  # that moves a decoded value reds here, and so does a corpus change, a new disagreement, a
  # disagreement that quietly went away, an oracle that refuses a document it used to read, and an
  # unreachable oracle.
  #
  # Every pin is written twice, here and in `package.json`'s `differential` script, and the two
  # cannot silently drift: each driver asks its oracle which version, which companion packages and
  # which interpreter it is actually running, and refuses any answer that is not the one
  # `package.json` pins. Bump one copy without the other and this job reds on that refusal rather
  # than producing a report about a different reader.
  #
  # The interpreter is provisioned explicitly at the exact version the LinuxForHealth x12 pin names,
  # because that oracle's Pydantic 1 release does not import on every Python the runner's own
  # `python3` might be. Both oracles run on it; pyx12 needs 3.11 or later. Each oracle goes in its
  # own throwaway virtual environment, so neither's packages can satisfy the other's.
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.11.16"
      - name: Provision both oracles
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" -m venv "$RUNNER_TEMP/pyx12-venv"
          "$RUNNER_TEMP/pyx12-venv/bin/pip" install --disable-pip-version-check "pyx12==4.0.0"
          "$PYTHON" -m venv "$RUNNER_TEMP/linuxforhealth-venv"
          "$RUNNER_TEMP/linuxforhealth-venv/bin/pip" install --disable-pip-version-check \
            "linuxforhealth-x12==0.57.0" "pydantic==1.10.13" "python-dotenv==1.2.3" \
            "typing-extensions==4.16.0"
      - name: Reproduce the committed report
        run: |
          export X12_DIFFERENTIAL_PYTHON="$RUNNER_TEMP/pyx12-venv/bin/python"
          export X12_DIFFERENTIAL_LINUXFORHEALTH_PYTHON="$RUNNER_TEMP/linuxforhealth-venv/bin/python"
          pnpm run differential:check

  # The runnable examples under examples/, checked the way a consumer meets them: each imports
  # `@cosyte/x12` by name, which resolves through package.json `exports` to the BUILT dist/, so the
  # build runs first. Each example asserts its own output, so `pnpm examples` goes red when one
  # drifts from the package. The PHI scan's default walk (src/ and test/) does not reach examples/,
  # so the example files are named to it here.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck:examples
      - run: pnpm lint:examples
      - run: pnpm examples
      - run: pnpm phi-scan:examples

  # The cold import budget of both entry points: a new Node.js process imports dist/index.mjs
  # (`@cosyte/x12`) and dist/parse.mjs (`@cosyte/x12/parse`), twenty times each, and each median
  # must be within its budget in scripts/check-cold-import.mjs, set from the slowest runner class
  # this label has met. It is read here rather than on a developer's machine, where other work moves
  # the number by milliseconds; imports of an empty module are interleaved with it, and the line
  # names the CPU, so a slow runner shows as a slow empty import on a named machine.
  cold-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cold import budget (pnpm check:cold-import)
        run: pnpm check:cold-import

  # The repository's documents, each held by the shared checker in @cosyte/script-utils: the README
  # against the house skeleton and npm's size limit, the CLAUDE.md card against its spec, and the
  # package.json description against the catalog of our libraries. It also runs
  # `cosyte-process check`, which holds the build, test, lint, typecheck and format scripts to the
  # exact `cosyte-process` delegations and validates cosyte-process.config.json, and
  # `cosyte-docs-reference --check` (@cosyte/process), which regenerates the API reference under
  # docs-content/api/ from the TSDoc of both entry points and fails when a committed page differs,
  # when an export has no TSDoc summary, or when a TSDoc comment holds a heading: regenerate with
  # `pnpm docs:reference` and commit the pages with the change that moved them.
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:readme
      - run: pnpm check:claude-card
      - run: pnpm check:catalog
      - run: pnpm check:process
      - run: pnpm check:docs-reference
      # Rehearses the release version step in a temporary copy and holds it to the reference check.
      - run: pnpm check:version-bump

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on the standard Node matrix (22 + 24). x12 ships a PHI scanner,
  # so the shared pipeline's optional PHI-scan step is switched on.
  #
  # THE DOCS-CONTENT GATE, and what it will and will not red you for. `check-docs-content: true`
  # switches on the shared pipeline's docs-content checker. WHICH DIRECTORY IT VALIDATES: this
  # repo's `docs-content/`, the tree packed into `docs-content.tar.gz` at release and mounted by
  # the `cosyte/docs` site. WHAT FAILS THIS CHECK: a package-internal link target under that
  # directory resolving to no REGULAR FILE (the accepted spellings are `<t>`, `<t>.md`, `<t>.mdx`,
  # `<t>/index.md` and `<t>/index.mdx`, so a bare directory named `<t>` resolves nothing); a
  # `sidebars.json` document id no file declares; and an image destination with no file at exactly
  # that path. Same-page anchors, external URLs, site-absolute paths and relative links that escape
  # `docs-content/` are REPORTED and never failed, because `cosyte/docs` owns those classes.
  # WHERE THE RULES LIVE: not here. They are implemented in the shared reusable workflow's own
  # repository, `cosyte/.github` (the `github-profile` repo in the meta checkout), which is also
  # where a rule that looks wrong gets fixed. The input is off by default and switching it on
  # requires `docs-content/sidebars.json` under that exact name. Why it is on: nothing between an
  # author and the published site used to resolve these links, and a broken one x12 shipped kept
  # docs.cosyte.com red for eight consecutive days while every x12 check stayed green.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@main
    with:
      run-phi-scan: true
      check-docs-content: true

  # Prove the publish pipeline on every push/PR WITHOUT burning a version or needing registry auth
  # (X12-10, mirroring config's REL-PIPE). Two auth-free proofs:
  #   1. `pnpm publish --dry-run` exercises the real publish command path (manifest, `files` set,
  #      access, tag), the release itself publishes via `changeset publish`, so this is a faithful
  #      proxy. It runs `--ignore-scripts` because the `prepublishOnly` gates (typecheck/lint/test/
  #      build/attw) already run in the `ci` job above on this same commit, re-running them here is
  #      redundant, and `attw --pack .` inside `prepublishOnly` breaks under `pnpm publish` (it can't
  #      find its own packed tarball). We build explicitly first so a real `dist/` is present.
  #   2. `npm pack --dry-run` asserts the publishable tarball actually assembles with the right file
  #      set + built `dist/`, independent of what's already on npm (`publish --dry-run` skips an
  #      already-published version; `pack` never does). A red in either step means a real release
  #      would fail. The real provenance publish stays gated on the public flip (PUB-FLIP / X12-PUB).
  release-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Exercise the publish command path (auth-free dry run; never uploads).
      - name: Publish dry-run
        run: pnpm publish --dry-run --no-git-checks --ignore-scripts
      # Assert the publishable tarball assembles (catches missing files/dist/exports) even when the
      # current version is already on npm, which `publish --dry-run` skips.
      - name: Pack integrity
        run: npm pack --dry-run --ignore-scripts

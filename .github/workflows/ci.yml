name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on the standard Node matrix (22 + 24). x12 ships a PHI scanner,
  # so the shared pipeline's optional PHI-scan step is switched on.
  #
  # The shared pipeline is named at an immutable published reference, never at the callee's default
  # branch: a floating reference delivers every later change made there on that repository's clock
  # rather than this one's, reviewed by nobody here, so x12's CI conclusion could move with no x12
  # commit. Bump this by naming a newer release from https://github.com/cosyte/.github/releases.
  ci:
    # cosyte/.github release workflows-2026-09-08-7b69a1cbbce3
    uses: cosyte/.github/.github/workflows/ci.yml@7b69a1cbbce33815a646483498a7c86007b6c029
    with:
      run-phi-scan: true

  # Prove the publish pipeline on every push/PR WITHOUT burning a version or needing registry auth
  # (X12-10, mirroring config's REL-PIPE). Two auth-free proofs:
  #   1. `pnpm publish --dry-run` exercises the real publish command path (manifest, `files` set,
  #      access, tag), the release itself publishes via `changeset publish`, so this is a faithful
  #      proxy. It runs `--ignore-scripts` because the `prepublishOnly` gates (typecheck/lint/test/
  #      build/attw) already run in the `ci` job above on this same commit, re-running them here is
  #      redundant, and `attw --pack .` inside `prepublishOnly` breaks under `pnpm publish` (it can't
  #      find its own packed tarball). We build explicitly first so a real `dist/` is present.
  #   2. `npm pack --dry-run` asserts the publishable tarball actually assembles with the right file
  #      set + built `dist/`, independent of what's already on npm (`publish --dry-run` skips an
  #      already-published version; `pack` never does). A red in either step means a real release
  #      would fail. The real provenance publish stays gated on the public flip (PUB-FLIP / X12-PUB).
  release-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Exercise the publish command path (auth-free dry run; never uploads).
      - name: Publish dry-run
        run: pnpm publish --dry-run --no-git-checks --ignore-scripts
      # Assert the publishable tarball assembles (catches missing files/dist/exports) even when the
      # current version is already on npm, which `publish --dry-run` skips.
      - name: Pack integrity
        run: npm pack --dry-run --ignore-scripts

  # Re-run the differential comparison against both external oracles on every push and PR.
  #
  # The committed `test/differential/report.json` is the record of one run, and `pnpm test` only
  # gates it against `X12_TR3_CONFORMANCE` going stale. Neither notices a parse change that moves a
  # decoded value away from what another reader returns, so a harness that ran once at landing would
  # go on recording agreement that was true once. This job is what keeps it true: both oracles are
  # obtained for real and the comparison is run for real.
  #
  # WHAT THIS JOB GATES ON IS REPRODUCTION, NOT THE COMPARISON'S EXIT STATUS, and that is deliberate.
  # The corpus holds a document this library and pyx12 genuinely disagree about, so
  # `pnpm run differential` exits non-zero by design for as long as that disagreement stands: a
  # divergence is reported and left standing rather than fixed or suppressed. Gating on that status
  # would leave exactly two ways to a green check, fixing the parser or dropping the document from
  # the corpus, and the second is the cheap one. So the job runs `pnpm run differential:check`, the
  # same one command a developer or a reviewer runs, which runs the comparison for real and exits 0
  # only when the live report reproduces the committed one, divergences included. A parse change
  # that moves a decoded value reds here, and so does a corpus change, a new disagreement, a
  # disagreement that quietly went away, an oracle that refuses a document it used to read, and an
  # unreachable oracle.
  #
  # Every pin is written twice, here and in `package.json`'s `differential` script, and the two
  # cannot silently drift: each driver asks its oracle which version, which companion packages and
  # which interpreter it is actually running, and refuses any answer that is not the one
  # `package.json` pins. Bump one copy without the other and this job reds on that refusal rather
  # than producing a report about a different reader.
  #
  # The interpreter is provisioned explicitly at the exact version the LinuxForHealth x12 pin names,
  # because that oracle's Pydantic 1 release does not import on every Python the runner's own
  # `python3` might be. Both oracles run on it; pyx12 needs 3.11 or later. Each oracle goes in its
  # own throwaway virtual environment, so neither's packages can satisfy the other's.
  differential:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: "3.11.16"
      - name: Provision both oracles
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" -m venv "$RUNNER_TEMP/pyx12-venv"
          "$RUNNER_TEMP/pyx12-venv/bin/pip" install --disable-pip-version-check "pyx12==4.0.0"
          "$PYTHON" -m venv "$RUNNER_TEMP/linuxforhealth-venv"
          "$RUNNER_TEMP/linuxforhealth-venv/bin/pip" install --disable-pip-version-check \
            "linuxforhealth-x12==0.57.0" "pydantic==1.10.13" "python-dotenv==1.2.3" \
            "typing-extensions==4.16.0"
      - name: Reproduce the committed report
        run: |
          export X12_DIFFERENTIAL_PYTHON="$RUNNER_TEMP/pyx12-venv/bin/python"
          export X12_DIFFERENTIAL_LINUXFORHEALTH_PYTHON="$RUNNER_TEMP/linuxforhealth-venv/bin/python"
          pnpm run differential:check
